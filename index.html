<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IP Address Checker - Check your IP address through multiple detection sources">
    <title>IP Address Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f7fafc;
        }

        tbody tr.success {
            background-color: #f0fff4;
        }

        tbody tr.error {
            background-color: #fff5f5;
        }

        td {
            padding: 12px 10px;
            vertical-align: middle;
        }

        .source-cell {
            font-weight: 600;
            white-space: nowrap;
        }

        .source-flag {
            font-size: 1.2rem;
            margin-right: 5px;
        }

        .ip-cell {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #667eea;
        }

        .status-loading {
            color: #4299e1;
        }

        .status-success {
            color: #48bb78;
        }

        .status-error {
            color: #f56565;
        }

        .location-cell {
            color: #555;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .location-cell strong {
            color: #667eea;
            font-weight: 600;
        }

        .connectivity-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .connectivity-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }

        .connectivity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .connectivity-item {
            padding: 15px;
            border-radius: 8px;
            background: #f7fafc;
            border-left: 4px solid #667eea;
        }

        .connectivity-item.testing {
            border-left-color: #4299e1;
        }

        .connectivity-item.success {
            border-left-color: #48bb78;
        }

        .connectivity-item.failed {
            border-left-color: #f56565;
        }

        .connectivity-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .connectivity-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 3px;
        }

        .connectivity-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .connectivity-badge.domestic {
            background: #bee3f8;
            color: #2c5282;
        }

        .connectivity-badge.international {
            background: #c6f6d5;
            color: #22543d;
        }

        .connectivity-latency {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connectivity-latency.failed {
            color: #f56565;
            font-size: 1rem;
        }

        .latency-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .latency-indicator.excellent {
            background-color: #48bb78;
            box-shadow: 0 0 8px #48bb78;
        }

        .latency-indicator.good {
            background-color: #4299e1;
            box-shadow: 0 0 8px #4299e1;
        }

        .latency-indicator.fair {
            background-color: #ed8936;
            box-shadow: 0 0 8px #ed8936;
        }

        .latency-indicator.poor {
            background-color: #f56565;
            box-shadow: 0 0 8px #f56565;
        }

        .latency-indicator.failed {
            background-color: #1a202c;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e2e8f0;
            border-top-color: #4299e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }


        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .table-container {
                padding: 10px;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px 6px;
            }

            .source-cell {
                font-size: 0.9rem;
            }

            .location-cell {
                font-size: 0.75rem;
            }

            .connectivity-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 8px 4px;
            }

            .location-cell {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table-container">
            <table id="checksTable">
                <thead>
                    <tr>
                        <th>Source</th>
                        <th>IP Address</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="checksTableBody">
                </tbody>
            </table>
        </div>

        <div class="connectivity-section">
            <div class="connectivity-title">Connectivity Test</div>
            <div class="connectivity-grid" id="connectivityGrid">
            </div>
        </div>
    </div>

    <script>
        // IP checker sources configuration
        const ipCheckers = [
            // International sources - verified CORS support
            {
                name: 'seeip',
                flag: '🌍',
                country: 'US',
                url: 'https://api.seeip.org/jsonip',
                parser: data => data.ip
            },
            {
                name: 'cloudflare',
                flag: '🌍',
                country: 'US',
                url: 'https://1.1.1.1/cdn-cgi/trace',
                parser: data => {
                    const match = data.match(/ip=([^\n]+)/);
                    return match ? match[1] : null;
                },
                isText: true
            },
            {
                name: 'checkip.amazonaws',
                flag: '🌍',
                country: 'US',
                url: 'https://checkip.amazonaws.com/',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipecho.net',
                flag: '🌍',
                country: 'US',
                url: 'https://ipecho.net/plain',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ident.me',
                flag: '🌍',
                country: 'US',
                url: 'https://v4.ident.me',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'icanhazip',
                flag: '🌍',
                country: 'US',
                url: 'https://ipv4.icanhazip.com',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'wtfismyip',
                flag: '🌍',
                country: 'US',
                url: 'https://wtfismyip.com/json',
                parser: data => data.YourFuckingIPAddress
            },
            {
                name: 'ifconfig.me',
                flag: '🌍',
                country: 'US',
                url: 'https://ifconfig.me/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipinfo.io',
                flag: '🌍',
                country: 'US',
                url: 'https://ipinfo.io/json',
                parser: data => data.ip
            },
            {
                name: 'httpbin',
                flag: '🌍',
                country: 'US',
                url: 'https://httpbin.org/ip',
                parser: data => data.origin?.split(',')[0].trim()
            },
            {
                name: 'tnedi.me',
                flag: '🌍',
                country: 'US',
                url: 'https://tnedi.me',
                parser: data => data.trim(),
                isText: true
            },
            // Chinese sources
            {
                name: 'ip.sb',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ip.sb-geoip',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/geoip',
                parser: data => ({
                    ip: data.ip,
                    location: data.country && data.city ? `${data.country} ${data.region || ''} ${data.city}`.trim() : null,
                    isp: data.isp || data.organization || '',
                    asn: data.asn || ''
                }),
                hasLocation: true
            },
            {
                name: 'myip.ipip.net',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://myip.ipip.net/json',
                parser: data => data.data?.ip || data.data?.IP
            },
            {
                name: 'myip.la',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.myip.la/en?json',
                parser: data => data.ip
            },
            {
                name: 'cz88.net',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://www.cz88.net/api/cz88/ip/base?ip=',
                parser: data => data.data?.ip
            }
        ];

        let successCount = 0;
        let failCount = 0;
        let totalCount = ipCheckers.length;
        let detectedIPs = {};
        let mostCommonIP = null;
        let locationCache = {}; // Cache for location data
        let locationDataCache = {}; // Cache for detailed location data (ISP, ASN, etc.)

        // Create table row
        function createTableRow(checker) {
            const tr = document.createElement('tr');
            tr.id = `row-${checker.name}`;
            tr.innerHTML = `
                <td class="source-cell">
                    <span class="source-flag">${checker.flag}</span>
                    ${checker.name}
                </td>
                <td class="ip-cell">
                    <div class="status-loading">
                        <span class="spinner"></span>Checking...
                    </div>
                </td>
                <td class="location-cell">
                    <span class="status-loading">-</span>
                </td>
            `;
            return tr;
        }

        // Query IP geolocation with detailed info (location, ISP, ASN)
        async function getIPLocation(ip) {
            // Check cache first
            if (locationDataCache[ip]) {
                return locationDataCache[ip];
            }

            // Try multiple geolocation services
            const geoServices = [
                {
                    name: 'ipwhois',
                    url: `https://ipwho.is/${ip}`,
                    parser: (data) => {
                        if (data.success !== false && data.country) {
                            const result = {
                                location: `${data.country} ${data.region || ''} ${data.city || ''}`.trim(),
                                isp: data.connection?.isp || data.connection?.org || '',
                                asn: data.connection?.asn ? `AS${data.connection.asn}` + (data.connection.org ? ` ${data.connection.org}` : '') : ''
                            };
                            return result;
                        }
                        return null;
                    }
                },
                {
                    name: 'ipapi',
                    url: `https://ipapi.co/${ip}/json/`,
                    parser: (data) => {
                        if (data.country_name) {
                            const result = {
                                location: `${data.country_name || ''} ${data.region || ''} ${data.city || ''}`.trim(),
                                isp: data.org || '',
                                asn: data.asn || ''
                            };
                            return result;
                        }
                        return null;
                    }
                },
                {
                    name: 'freeipapi',
                    url: `https://freeipapi.com/api/json/${ip}`,
                    parser: (data) => {
                        if (data.countryName) {
                            const result = {
                                location: `${data.countryName} ${data.regionName || ''} ${data.cityName || ''}`.trim(),
                                isp: data.isp || '',
                                asn: data.asn ? `AS${data.asn}` : ''
                            };
                            return result;
                        }
                        return null;
                    }
                },
                {
                    name: 'geojs',
                    url: `https://get.geojs.io/v1/ip/geo/${ip}.json`,
                    parser: (data) => {
                        if (data.country && data.city) {
                            const result = {
                                location: `${data.country} ${data.region || ''} ${data.city}`.trim(),
                                isp: data.organization || '',
                                asn: data.asn || ''
                            };
                            return result;
                        }
                        return null;
                    }
                }
            ];

            for (const service of geoServices) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 5000);

                    const response = await fetch(service.url, {
                        signal: controller.signal
                    });
                    clearTimeout(timeout);

                    if (response.ok) {
                        const data = await response.json();
                        const locationData = service.parser(data);
                        if (locationData && locationData.location) {
                            locationDataCache[ip] = locationData;
                            return locationData;
                        }
                    }
                } catch (error) {
                    // Try next service
                    continue;
                }
            }

            return { location: '-', isp: '', asn: '' };
        }

        // Update statistics
        function updateStats() {
            successCount;
            failCount;
            totalCount;

            // Calculate most common IP
            if (Object.keys(detectedIPs).length > 0) {
                mostCommonIP = Object.keys(detectedIPs).reduce((a, b) =>
                    detectedIPs[a] > detectedIPs[b] ? a : b
                );
            }
        }

        // Execute IP check
        async function checkIP(checker) {
            const row = document.getElementById(`row-${checker.name}`);
            const ipCell = row.cells[1];
            const locationCell = row.cells[2];

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000); // 10 seconds timeout

                const response = await fetch(checker.url, {
                    signal: controller.signal,
                    mode: 'cors',
                    cache: 'no-cache'
                });

                clearTimeout(timeout);

                let data;
                if (checker.isText) {
                    data = await response.text();
                } else {
                    data = await response.json();
                }

                const result = checker.parser(data);

                // Handle both string IP and object {ip, location, isp, asn}
                let ip, locationData;
                if (typeof result === 'string') {
                    ip = result;
                    locationData = null;
                } else if (result && result.ip) {
                    ip = result.ip;
                    locationData = result;
                } else {
                    throw new Error('Invalid response format');
                }

                if (ip && /^(\d{1,3}\.){3}\d{1,3}$|^([0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}$/.test(ip)) {
                    // Success
                    successCount++;
                    detectedIPs[ip] = (detectedIPs[ip] || 0) + 1;

                    row.className = 'success';
                    ipCell.innerHTML = `<div class="status-success">${ip}</div>`;

                    // Check if we need to query geolocation API
                    locationCell.innerHTML = '<span class="status-loading">Loading...</span>';

                    // Determine which fields are missing from source
                    const needsLocation = !locationData || !locationData.location;
                    const needsISP = !locationData || !locationData.isp;
                    const needsASN = !locationData || !locationData.asn;

                    let apiLocationData = { location: '', isp: '', asn: '' };

                    // Only query API if at least one field is missing
                    if (needsLocation || needsISP || needsASN) {
                        apiLocationData = await getIPLocation(ip);
                    }

                    // Merge data: prioritize source data for each field individually
                    const finalLocationData = {
                        location: (locationData && locationData.location) || apiLocationData.location || '-',
                        isp: (locationData && locationData.isp) || apiLocationData.isp || '',
                        asn: (locationData && locationData.asn) || apiLocationData.asn || ''
                    };

                    // Format and display location info
                    let locationHTML = '';
                    if (finalLocationData.location && finalLocationData.location !== '-') {
                        locationHTML += `<div style="margin-bottom: 3px;"><strong>Location:</strong> ${finalLocationData.location}</div>`;
                    }
                    if (finalLocationData.isp) {
                        locationHTML += `<div style="margin-bottom: 3px;"><strong>ISP:</strong> ${finalLocationData.isp}</div>`;
                    }
                    if (finalLocationData.asn) {
                        locationHTML += `<div><strong>ASN:</strong> ${finalLocationData.asn}</div>`;
                    }

                    if (!locationHTML) {
                        locationHTML = '<span>-</span>';
                    }

                    locationCell.innerHTML = locationHTML;
                } else {
                    throw new Error('Invalid IP format');
                }
            } catch (error) {
                // Failed
                failCount++;
                row.className = 'error';
                ipCell.innerHTML = `<div class="status-error">Failed</div>`;
                locationCell.innerHTML = `<span class="status-error">-</span>`;
            }

            updateStats();
        }

        // Initialize
        function init() {
            const tbody = document.getElementById('checksTableBody');

            // Create all table rows
            ipCheckers.forEach(checker => {
                tbody.appendChild(createTableRow(checker));
            });

            // Execute all checks concurrently
            ipCheckers.forEach(checker => {
                checkIP(checker);
            });

            updateStats();
        }

        // Connectivity test configuration
        const connectivityTests = [
            {
                name: 'ByteDance',
                url: 'https://www.bytedance.com/favicon.ico',
                type: 'domestic',
                icon: 'https://www.bytedance.com/favicon.ico'
            },
            {
                name: 'Bilibili',
                url: 'https://www.bilibili.com/favicon.ico',
                type: 'domestic',
                icon: 'https://www.bilibili.com/favicon.ico'
            },
            {
                name: 'ip.39203.com',
                url: 'https://ip.39203.com/favicon.ico',
                type: 'domestic',
                icon: 'https://ip.39203.com/favicon.ico'
            },
            {
                name: 'jsDelivr',
                url: 'https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js',
                type: 'international',
                icon: 'https://www.jsdelivr.com/favicon.ico'
            },
            {
                name: 'YouTube',
                url: 'https://www.youtube.com/favicon.ico',
                type: 'international',
                icon: 'https://www.youtube.com/s/desktop/6e78f535/img/favicon_32x32.png'
            },
            {
                name: 'Google',
                url: 'https://www.google.com/favicon.ico',
                type: 'international',
                icon: 'https://www.google.com/favicon.ico'
            },
            {
                name: 'GitHub',
                url: 'https://github.com/favicon.ico',
                type: 'international',
                icon: 'https://github.githubassets.com/favicons/favicon.svg'
            },
            {
                name: 'Docker',
                url: 'https://www.docker.com/favicon.ico',
                type: 'international',
                icon: 'https://www.docker.com/wp-content/uploads/2023/04/cropped-Docker-favicon-32x32.png'
            },
            {
                name: 'ChatGPT',
                url: 'https://chatgpt.com/favicon.ico',
                type: 'international',
                icon: 'https://cdn.oaistatic.com/assets/favicon-o20kmmos.svg'
            },
            {
                name: 'Claude.ai',
                url: 'https://claude.ai/favicon.ico',
                type: 'international',
                icon: 'https://claude.ai/favicon.ico'
            }
        ];

        // Test connectivity to a URL
        async function testConnectivity(test) {
            const startTime = performance.now();

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(test.url, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    signal: controller.signal
                });

                clearTimeout(timeout);
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);

                return { success: true, latency };
            } catch (error) {
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);

                // Even with no-cors, if we get a response quickly, it's likely successful
                if (latency < 10000) {
                    return { success: true, latency };
                }

                return { success: false, latency: null };
            }
        }

        // Create connectivity test item
        function createConnectivityItem(test) {
            const item = document.createElement('div');
            item.className = 'connectivity-item testing';
            item.id = `connectivity-${test.name.toLowerCase().replace(/\s+/g, '-').replace(/\./g, '-')}`;

            const badgeClass = test.type === 'domestic' ? 'domestic' : 'international';
            const badgeText = test.type === 'domestic' ? 'Domestic' : 'International';

            item.innerHTML = `
                <div class="connectivity-name">
                    <img src="${test.icon}" class="connectivity-icon" alt="${test.name}" onerror="this.style.display='none'">
                    <span>${test.name}</span>
                    <span class="connectivity-badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="connectivity-latency">
                    <span class="spinner"></span> Testing...
                </div>
            `;

            return item;
        }

        // Run connectivity tests
        async function runConnectivityTests() {
            const grid = document.getElementById('connectivityGrid');

            // Create all test items
            connectivityTests.forEach(test => {
                grid.appendChild(createConnectivityItem(test));
            });

            // Run tests
            for (const test of connectivityTests) {
                const result = await testConnectivity(test);
                const item = document.getElementById(`connectivity-${test.name.toLowerCase().replace(/\s+/g, '-').replace(/\./g, '-')}`);
                const latencyDiv = item.querySelector('.connectivity-latency');

                if (result.success) {
                    item.classList.remove('testing');
                    item.classList.add('success');

                    // Determine indicator color based on latency
                    let indicatorClass = 'failed';
                    if (result.latency < 100) {
                        indicatorClass = 'excellent'; // Green
                    } else if (result.latency < 200) {
                        indicatorClass = 'good'; // Blue
                    } else if (result.latency < 400) {
                        indicatorClass = 'fair'; // Orange
                    } else {
                        indicatorClass = 'poor'; // Red
                    }

                    latencyDiv.innerHTML = `
                        <span>${result.latency}ms</span>
                        <span class="latency-indicator ${indicatorClass}"></span>
                    `;
                } else {
                    item.classList.remove('testing');
                    item.classList.add('failed');
                    latencyDiv.classList.add('failed');
                    latencyDiv.innerHTML = `
                        <span>Failed</span>
                        <span class="latency-indicator failed"></span>
                    `;
                }
            }
        }

        // Execute after page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                init();
                runConnectivityTests();
            });
        } else {
            init();
            runConnectivityTests();
        }
    </script>
</body>
</html>
