<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IP Address Checker - Check your IP address through multiple detection sources">
    <title>IP Address Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f7fafc;
        }

        tbody tr.success {
            background-color: #f0fff4;
        }

        tbody tr.error {
            background-color: #fff5f5;
        }

        td {
            padding: 12px 10px;
            vertical-align: middle;
        }

        .source-cell {
            font-weight: 600;
            white-space: nowrap;
        }

        .source-flag {
            font-size: 1.2rem;
            margin-right: 5px;
        }

        .ip-cell {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #667eea;
        }

        .status-loading {
            color: #4299e1;
        }

        .status-success {
            color: #48bb78;
        }

        .status-error {
            color: #f56565;
        }

        .location-cell {
            color: #555;
            font-size: 0.9rem;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e2e8f0;
            border-top-color: #4299e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }


        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .table-container {
                padding: 10px;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px 6px;
            }

            .source-cell {
                font-size: 0.9rem;
            }

            .location-cell {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 8px 4px;
            }

            .location-cell {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table-container">
            <table id="checksTable">
                <thead>
                    <tr>
                        <th>Source</th>
                        <th>IP Address</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="checksTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // IP checker sources configuration
        const ipCheckers = [
            // International sources - verified CORS support
            {
                name: 'seeip',
                flag: '🌍',
                country: 'US',
                url: 'https://api.seeip.org/jsonip',
                parser: data => data.ip
            },
            {
                name: 'cloudflare',
                flag: '🌍',
                country: 'US',
                url: 'https://1.1.1.1/cdn-cgi/trace',
                parser: data => {
                    const match = data.match(/ip=([^\n]+)/);
                    return match ? match[1] : null;
                },
                isText: true
            },
            {
                name: 'checkip.amazonaws',
                flag: '🌍',
                country: 'US',
                url: 'https://checkip.amazonaws.com/',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipecho.net',
                flag: '🌍',
                country: 'US',
                url: 'https://ipecho.net/plain',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ident.me',
                flag: '🌍',
                country: 'US',
                url: 'https://v4.ident.me',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'icanhazip',
                flag: '🌍',
                country: 'US',
                url: 'https://ipv4.icanhazip.com',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'wtfismyip',
                flag: '🌍',
                country: 'US',
                url: 'https://wtfismyip.com/json',
                parser: data => data.YourFuckingIPAddress
            },
            {
                name: 'ifconfig.me',
                flag: '🌍',
                country: 'US',
                url: 'https://ifconfig.me/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipify',
                flag: '🌍',
                country: 'US',
                url: 'https://api.ipify.org?format=json',
                parser: data => data.ip
            },
            {
                name: 'ipify-text',
                flag: '🌍',
                country: 'US',
                url: 'https://api.ipify.org',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'api64.ipify',
                flag: '🌍',
                country: 'US',
                url: 'https://api64.ipify.org?format=json',
                parser: data => data.ip
            },
            {
                name: 'httpbin',
                flag: '🌍',
                country: 'US',
                url: 'https://httpbin.org/ip',
                parser: data => data.origin?.split(',')[0].trim()
            },
            {
                name: 'tnedi.me',
                flag: '🌍',
                country: 'US',
                url: 'https://tnedi.me',
                parser: data => data.trim(),
                isText: true
            },
            // Chinese sources
            {
                name: 'ip.sb',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ip.sb-geoip',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/geoip',
                parser: data => data.ip
            },
            {
                name: 'myip.ipip.net',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://myip.ipip.net/json',
                parser: data => data.data?.ip || data.data?.IP
            },
            {
                name: 'myip.la',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.myip.la/en?json',
                parser: data => data.ip
            },
            {
                name: 'cip.cc',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ip.cip.cc',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ip.cn',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ip.cn/api/index?ip=&type=0',
                parser: data => data.ip
            },
            {
                name: 'ipinfo.io',
                flag: '🌍',
                country: 'US',
                url: 'https://ipinfo.io/json',
                parser: data => data.ip
            },
            {
                name: 'ip-api.com',
                flag: '🌍',
                country: 'US',
                url: 'http://ip-api.com/json/?fields=query',
                parser: data => data.query
            },
            {
                name: 'r.inews.qq.com',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://r.inews.qq.com/api/ip2city',
                parser: data => data.ip
            },
            {
                name: 'ip138.com',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip138.com/query/',
                parser: data => data.data?.[0]?.ip || data.ip
            }
        ];

        let successCount = 0;
        let failCount = 0;
        let totalCount = ipCheckers.length;
        let detectedIPs = {};
        let mostCommonIP = null;
        let locationCache = {}; // Cache for location data

        // Create table row
        function createTableRow(checker) {
            const tr = document.createElement('tr');
            tr.id = `row-${checker.name}`;
            tr.innerHTML = `
                <td class="source-cell">
                    <span class="source-flag">${checker.flag}</span>
                    ${checker.name}
                </td>
                <td class="ip-cell">
                    <div class="status-loading">
                        <span class="spinner"></span>Checking...
                    </div>
                </td>
                <td class="location-cell">
                    <span class="status-loading">-</span>
                </td>
            `;
            return tr;
        }

        // Query IP geolocation
        async function getIPLocation(ip) {
            // Check cache first
            if (locationCache[ip]) {
                return locationCache[ip];
            }

            try {
                // Use ipapi.co for geolocation (supports HTTPS and CORS)
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(`https://ipapi.co/${ip}/json/`, {
                    signal: controller.signal
                });
                clearTimeout(timeout);

                const data = await response.json();

                if (data.country_name) {
                    const location = `${data.country_name || ''} ${data.region || ''} ${data.city || ''}`.trim();
                    if (location) {
                        locationCache[ip] = location;
                        return location;
                    }
                }
            } catch (error) {
                // If ipapi.co fails, try ipinfo.io
                try {
                    const response = await fetch(`https://ipinfo.io/${ip}/json`);
                    const data = await response.json();
                    if (data.country) {
                        const location = `${data.country} ${data.region || ''} ${data.city || ''}`.trim();
                        if (location) {
                            locationCache[ip] = location;
                            return location;
                        }
                    }
                } catch (e) {
                    // Finally try ip-api.com (some environments may support HTTP)
                    try {
                        const response = await fetch(`http://ip-api.com/json/${ip}?lang=en&fields=country,regionName,city`);
                        const data = await response.json();
                        if (data.country) {
                            const location = `${data.country} ${data.regionName || ''} ${data.city || ''}`.trim();
                            if (location) {
                                locationCache[ip] = location;
                                return location;
                            }
                        }
                    } catch (e2) {
                        // Ignore
                    }
                }
            }

            return '-';
        }

        // Update statistics
        function updateStats() {
            successCount;
            failCount;
            totalCount;

            // Calculate most common IP
            if (Object.keys(detectedIPs).length > 0) {
                mostCommonIP = Object.keys(detectedIPs).reduce((a, b) =>
                    detectedIPs[a] > detectedIPs[b] ? a : b
                );
            }
        }

        // Execute IP check
        async function checkIP(checker) {
            const row = document.getElementById(`row-${checker.name}`);
            const ipCell = row.cells[1];
            const locationCell = row.cells[2];

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000); // 10 seconds timeout

                const response = await fetch(checker.url, {
                    signal: controller.signal,
                    mode: 'cors',
                    cache: 'no-cache'
                });

                clearTimeout(timeout);

                let data;
                if (checker.isText) {
                    data = await response.text();
                } else {
                    data = await response.json();
                }

                const ip = checker.parser(data);

                if (ip && /^(\d{1,3}\.){3}\d{1,3}$|^([0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}$/.test(ip)) {
                    // Success
                    successCount++;
                    detectedIPs[ip] = (detectedIPs[ip] || 0) + 1;

                    row.className = 'success';
                    ipCell.innerHTML = `<div class="status-success">${ip}</div>`;

                    // Query geolocation asynchronously
                    locationCell.innerHTML = '<span class="status-loading">Loading...</span>';
                    const location = await getIPLocation(ip);
                    locationCell.innerHTML = `<span>${location}</span>`;
                } else {
                    throw new Error('Invalid IP format');
                }
            } catch (error) {
                // Failed
                failCount++;
                row.className = 'error';
                ipCell.innerHTML = `<div class="status-error">Failed</div>`;
                locationCell.innerHTML = `<span class="status-error">-</span>`;
            }

            updateStats();
        }

        // Initialize
        function init() {
            const tbody = document.getElementById('checksTableBody');

            // Create all table rows
            ipCheckers.forEach(checker => {
                tbody.appendChild(createTableRow(checker));
            });

            // Execute all checks concurrently
            ipCheckers.forEach(checker => {
                checkIP(checker);
            });

            updateStats();
        }

        // Execute after page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
