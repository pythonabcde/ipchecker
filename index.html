<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IP地址检测工具 - 通过多个检测源查询您的IP地址">
    <title>IP地址检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .summary-title {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .ip-display {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            text-align: center;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f7fafc;
        }

        tbody tr.success {
            background-color: #f0fff4;
        }

        tbody tr.error {
            background-color: #fff5f5;
        }

        td {
            padding: 12px 10px;
            vertical-align: middle;
        }

        .source-cell {
            font-weight: 600;
            white-space: nowrap;
        }

        .source-flag {
            font-size: 1.2rem;
            margin-right: 5px;
        }

        .ip-cell {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #667eea;
        }

        .status-loading {
            color: #4299e1;
        }

        .status-success {
            color: #48bb78;
        }

        .status-error {
            color: #f56565;
        }

        .time-info {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 3px;
        }

        .location-cell {
            color: #555;
            font-size: 0.9rem;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e2e8f0;
            border-top-color: #4299e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }

        footer a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }

        footer a:hover {
            border-bottom-color: white;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .ip-display {
                font-size: 1.5rem;
                padding: 15px;
            }

            .summary-card {
                padding: 18px;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .table-container {
                padding: 10px;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px 6px;
            }

            .source-cell {
                font-size: 0.9rem;
            }

            .location-cell {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .ip-display {
                font-size: 1.2rem;
            }

            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 8px 4px;
            }

            .location-cell {
                max-width: 150px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 IP地址检测</h1>
            <p class="subtitle">通过多个检测源查询您的IP地址</p>
        </header>

        <div class="summary-card">
            <div class="summary-title">您的IP地址</div>
            <div class="ip-display" id="mainIP">检测中...</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="successCount">0</div>
                    <div class="stat-label">成功</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="failCount">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总数</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="checksTable">
                <thead>
                    <tr>
                        <th>检测源</th>
                        <th>IP地址</th>
                        <th>地理位置</th>
                    </tr>
                </thead>
                <tbody id="checksTableBody">
                </tbody>
            </table>
        </div>

        <footer>
            <p>Powered by Multiple IP Detection Services</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">
                <a href="https://github.com" target="_blank">GitHub</a>
            </p>
        </footer>
    </div>

    <script>
        // IP检测源配置（28个检测源：19个国际 + 9个中国）
        const ipCheckers = [
            // 国际检测源 - 经过验证支持CORS
            {
                name: 'seeip',
                flag: '🌍',
                country: 'US',
                url: 'https://api.seeip.org/jsonip',
                parser: data => data.ip
            },
            {
                name: 'cloudflare',
                flag: '🌍',
                country: 'US',
                url: 'https://1.1.1.1/cdn-cgi/trace',
                parser: data => {
                    const match = data.match(/ip=([^\n]+)/);
                    return match ? match[1] : null;
                },
                isText: true
            },
            {
                name: 'checkip.amazonaws',
                flag: '🌍',
                country: 'US',
                url: 'https://checkip.amazonaws.com/',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipecho.net',
                flag: '🌍',
                country: 'US',
                url: 'https://ipecho.net/plain',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ident.me',
                flag: '🌍',
                country: 'US',
                url: 'https://v4.ident.me',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'icanhazip',
                flag: '🌍',
                country: 'US',
                url: 'https://ipv4.icanhazip.com',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'wtfismyip',
                flag: '🌍',
                country: 'US',
                url: 'https://wtfismyip.com/json',
                parser: data => data.YourFuckingIPAddress
            },
            {
                name: 'ifconfig.me',
                flag: '🌍',
                country: 'US',
                url: 'https://ifconfig.me/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ifconfig.co',
                flag: '🌍',
                country: 'US',
                url: 'https://ifconfig.co/json',
                parser: data => data.ip
            },
            {
                name: 'ipify',
                flag: '🌍',
                country: 'US',
                url: 'https://api.ipify.org?format=json',
                parser: data => data.ip
            },
            {
                name: 'ipify-text',
                flag: '🌍',
                country: 'US',
                url: 'https://api.ipify.org',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'api64.ipify',
                flag: '🌍',
                country: 'US',
                url: 'https://api64.ipify.org?format=json',
                parser: data => data.ip
            },
            {
                name: 'myip.com',
                flag: '🌍',
                country: 'US',
                url: 'https://api.myip.com',
                parser: data => data.ip
            },
            {
                name: 'httpbin',
                flag: '🌍',
                country: 'US',
                url: 'https://httpbin.org/ip',
                parser: data => data.origin?.split(',')[0].trim()
            },
            {
                name: 'ip.guide',
                flag: '🌍',
                country: 'US',
                url: 'https://ip.guide',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ipconfig.io',
                flag: '🌍',
                country: 'US',
                url: 'https://ipconfig.io/json',
                parser: data => data.ip
            },
            {
                name: 'l2.io',
                flag: '🌍',
                country: 'US',
                url: 'https://l2.io/ip.json',
                parser: data => data.ip
            },
            {
                name: 'ip.tyk.nu',
                flag: '🌍',
                country: 'US',
                url: 'https://ip.tyk.nu',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'tnedi.me',
                flag: '🌍',
                country: 'US',
                url: 'https://tnedi.me',
                parser: data => data.trim(),
                isText: true
            },
            // 中国检测源 - 9个
            {
                name: 'ip.sb',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/ip',
                parser: data => data.trim(),
                isText: true
            },
            {
                name: 'ip.sb-geoip',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.ip.sb/geoip',
                parser: data => data.ip
            },
            {
                name: 'myip.ipip.net',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://myip.ipip.net/json',
                parser: data => data.data?.ip || data.data?.IP
            },
            {
                name: 'ipw.cn',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ipw.cn/api/ip/myip',
                parser: data => data.IP || data.ip
            },
            {
                name: 'ip.useragentinfo',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ip.useragentinfo.com/json',
                parser: data => data.ip
            },
            {
                name: 'ip.taobao',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ip.taobao.com/outGetIpInfo?accessKey=alibaba-inc',
                parser: data => data.data?.ip
            },
            {
                name: 'myip.la',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://api.myip.la/en?json',
                parser: data => data.ip
            },
            {
                name: 'ip125',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://www.ip125.com/api/get_my_ip/',
                parser: data => data.ip
            },
            {
                name: 'cip.cc',
                flag: '🇨🇳',
                country: 'CN',
                url: 'https://ip.cip.cc',
                parser: data => data.trim(),
                isText: true
            }
        ];

        let successCount = 0;
        let failCount = 0;
        let totalCount = ipCheckers.length;
        let detectedIPs = {};
        let mostCommonIP = null;
        let locationCache = {}; // 缓存地理位置信息

        // 创建表格行
        function createTableRow(checker) {
            const tr = document.createElement('tr');
            tr.id = `row-${checker.name}`;
            tr.innerHTML = `
                <td class="source-cell">
                    <span class="source-flag">${checker.flag}</span>
                    ${checker.name}
                </td>
                <td class="ip-cell">
                    <div class="status-loading">
                        <span class="spinner"></span>检测中...
                    </div>
                </td>
                <td class="location-cell">
                    <span class="status-loading">-</span>
                </td>
            `;
            return tr;
        }

        // 查询IP地理位置
        async function getIPLocation(ip) {
            // 先检查缓存
            if (locationCache[ip]) {
                return locationCache[ip];
            }

            try {
                // 使用ipapi.co查询地理位置（支持HTTPS和CORS）
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(`https://ipapi.co/${ip}/json/`, {
                    signal: controller.signal
                });
                clearTimeout(timeout);

                const data = await response.json();

                if (data.country_name) {
                    const location = `${data.country_name || ''} ${data.region || ''} ${data.city || ''}`.trim();
                    if (location) {
                        locationCache[ip] = location;
                        return location;
                    }
                }
            } catch (error) {
                // 如果ipapi.co失败，尝试使用ipinfo.io
                try {
                    const response = await fetch(`https://ipinfo.io/${ip}/json`);
                    const data = await response.json();
                    if (data.country) {
                        const location = `${data.country} ${data.region || ''} ${data.city || ''}`.trim();
                        if (location) {
                            locationCache[ip] = location;
                            return location;
                        }
                    }
                } catch (e) {
                    // 最后尝试使用ip-api.com（某些环境可能支持HTTP）
                    try {
                        const response = await fetch(`http://ip-api.com/json/${ip}?lang=zh-CN&fields=country,regionName,city`);
                        const data = await response.json();
                        if (data.country) {
                            const location = `${data.country} ${data.regionName || ''} ${data.city || ''}`.trim();
                            if (location) {
                                locationCache[ip] = location;
                                return location;
                            }
                        }
                    } catch (e2) {
                        // 忽略
                    }
                }
            }

            return '-';
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('totalCount').textContent = totalCount;

            // 计算最常见的IP
            if (Object.keys(detectedIPs).length > 0) {
                mostCommonIP = Object.keys(detectedIPs).reduce((a, b) =>
                    detectedIPs[a] > detectedIPs[b] ? a : b
                );
                document.getElementById('mainIP').textContent = mostCommonIP;
            }
        }

        // 执行IP检测
        async function checkIP(checker) {
            const startTime = Date.now();
            const row = document.getElementById(`row-${checker.name}`);
            const ipCell = row.cells[1];
            const locationCell = row.cells[2];

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000); // 10秒超时

                const response = await fetch(checker.url, {
                    signal: controller.signal,
                    mode: 'cors',
                    cache: 'no-cache'
                });

                clearTimeout(timeout);

                let data;
                if (checker.isText) {
                    data = await response.text();
                } else {
                    data = await response.json();
                }

                const ip = checker.parser(data);
                const duration = Date.now() - startTime;

                if (ip && /^(\d{1,3}\.){3}\d{1,3}$|^([0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}$/.test(ip)) {
                    // 成功
                    successCount++;
                    detectedIPs[ip] = (detectedIPs[ip] || 0) + 1;

                    row.className = 'success';
                    ipCell.innerHTML = `
                        <div class="status-success">${ip}</div>
                        <div class="time-info">响应时间: ${duration}ms</div>
                    `;

                    // 异步查询地理位置
                    locationCell.innerHTML = '<span class="status-loading">查询中...</span>';
                    const location = await getIPLocation(ip);
                    locationCell.innerHTML = `<span>${location}</span>`;
                } else {
                    throw new Error('无效的IP格式');
                }
            } catch (error) {
                // 失败
                failCount++;
                row.className = 'error';
                ipCell.innerHTML = `<div class="status-error">检测失败</div>`;
                locationCell.innerHTML = `<span class="status-error">-</span>`;
            }

            updateStats();
        }

        // 初始化
        function init() {
            const tbody = document.getElementById('checksTableBody');

            // 创建所有表格行
            ipCheckers.forEach(checker => {
                tbody.appendChild(createTableRow(checker));
            });

            // 并发执行所有检测
            ipCheckers.forEach(checker => {
                checkIP(checker);
            });

            updateStats();
        }

        // 页面加载完成后执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
