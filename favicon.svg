<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="earthGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#6eb5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5a8e;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Ocean -->
  <circle cx="50" cy="50" r="45" fill="url(#earthGradient)"/>

  <!-- Land masses (simplified continents) -->
  <g fill="#2d8659" opacity="0.9">
    <!-- North America -->
    <path d="M 25,30 Q 20,25 25,20 Q 30,22 32,28 Q 28,32 25,30 Z"/>

    <!-- South America -->
    <path d="M 30,45 Q 28,40 30,38 Q 35,40 35,48 Q 32,50 30,45 Z"/>

    <!-- Europe -->
    <path d="M 48,22 Q 45,20 48,18 Q 52,20 54,24 Q 50,26 48,22 Z"/>

    <!-- Africa -->
    <path d="M 52,35 Q 48,30 50,28 Q 56,32 58,42 Q 54,45 52,35 Z"/>

    <!-- Asia -->
    <path d="M 60,20 Q 65,18 72,22 Q 75,28 72,35 Q 68,32 65,28 Q 62,24 60,20 Z"/>

    <!-- Australia -->
    <path d="M 70,55 Q 68,52 70,50 Q 75,52 76,56 Q 73,58 70,55 Z"/>
  </g>

  <!-- White clouds -->
  <g fill="white" opacity="0.3">
    <ellipse cx="35" cy="25" rx="8" ry="4" transform="rotate(-20 35 25)"/>
    <ellipse cx="60" cy="40" rx="10" ry="5" transform="rotate(15 60 40)"/>
    <ellipse cx="45" cy="60" rx="7" ry="3" transform="rotate(-30 45 60)"/>
  </g>

  <!-- Shine effect -->
  <ellipse cx="35" cy="32" rx="12" ry="18" fill="white" opacity="0.15" transform="rotate(-45 35 32)"/>

  <!-- Border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#0a3d62" stroke-width="2" opacity="0.3"/>
</svg>
